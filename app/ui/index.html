<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cirklon2 Desktop App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand"><span class="led"></span>Cirklon2&nbsp;Desktop&nbsp;App</span>
    <span class="crumb" id="crumb">no file loaded</span>
    <span class="spacer"></span>
    <button id="btnImport">Import…</button>
    <button id="btnPrepare" class="primary">Prepare for Cirklon</button>
  </div>
  <div class="body">
    <aside class="rail">
      <input id="railSearch" placeholder="Search instruments…" spellcheck="false">
      <div class="rail-list" id="railList"></div>
      <div class="rail-foot"><button id="btnNew">+ New instrument</button></div>
    </aside>
    <main class="stage" id="stage">
      <div class="empty-state" id="welcome">
        <h2>No instruments yet</h2>
        <p>Import a .CKI from your Cirklon's card, paste a MIDI chart into a new
        instrument, or start from scratch.</p>
        <button id="btnImport2" class="primary">Import a .CKI…</button>
      </div>
      <div id="editor" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="inst-head">
          <h1 id="instName"></h1>
          <span class="budget" id="nameBudget"></span>
          <span class="inst-sub" id="instSub"></span>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="panel" id="panel"></div>
      </div>
    </main>
  </div>
</div>
<div id="modals"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
