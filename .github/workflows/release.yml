name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Format harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/FormatHarness

  build:
    name: Build ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneOSX
            name: macOS
          - targetPlatform: StandaloneWindows64
            name: Windows
          - targetPlatform: StandaloneLinux64
            name: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Cirklon2 Desktop App

      - name: Package
        run: |
          sudo chown -R $USER build
          cd "build/${{ matrix.targetPlatform }}"
          zip -r "$GITHUB_WORKSPACE/Cirklon2-Desktop-App-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Cirklon2-Desktop-App-${{ matrix.name }}
          path: Cirklon2-Desktop-App-${{ matrix.name }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
