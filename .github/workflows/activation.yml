name: Acquire Unity activation file

# One-time helper for the free Personal license:
# run this workflow, download the .alf artifact, upload it at
# https://license.unity3d.com/manual to receive a .ulf, then paste the .ulf
# file's contents into the repository secret UNITY_LICENSE.
# Full steps: docs/RELEASING.md

on: workflow_dispatch

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Create manual activation file
        run: |
          mkdir alf
          docker run --rm -v "$PWD/alf:/output" -w /output \
            unityci/editor:ubuntu-2019.3.1f1-base-3 \
            unity-editor -batchmode -nographics -quit \
            -createManualActivationFile -logFile /dev/stdout || true
          ls -la alf
          test -f alf/Unity_v2019.3.1f1.alf

      - uses: actions/upload-artifact@v4
        with:
          name: Unity_v2019.3.1f1.alf
          path: alf/Unity_v2019.3.1f1.alf
